<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>生日快乐</title>
<link rel="stylesheet" href="https://fontsapi.zeoseven.com/522/main/result.css">
<style>
:root{
    --pink-1:#fff0f6;
    --pink-2:#ffd9ea;
    --pink-3:#ffb3d1;
    --pink-4:#ff8fb8;
    --pink-5:#ff6fae;
    /* LGGC 液态玻璃变量（依据 zhuzhudashuaibi/glass · glassMy.css 改色） */
    --lggc-bg: rgba(255,255,255,0.40);
    --lggc-border: rgba(255,120,170,0.18);
    --lggc-blur: 16px;
    --lggc-radius: 28px;
}

*{margin:0;padding:0;box-sizing:border-box;}

html,body{height:100%;}

body{
    min-height:100vh;
    font-family:'致一宋體','Songti SC','STSong',serif;
    overflow-x:hidden;
    background:
        radial-gradient(circle at 18% 22%, #ffe0ef 0%, transparent 45%),
        radial-gradient(circle at 82% 78%, #ffd6e8 0%, transparent 45%),
        linear-gradient(135deg,#fff5fa 0%,#ffe0ef 35%,#ffd6e8 65%,#ffeaf5 100%);
    background-attachment:fixed;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    color:rgba(70,40,55,0.92);
}

/* —— 给玻璃模糊用的色彩光斑 —— */
.blob{
    position:fixed;
    border-radius:50%;
    z-index:0;
    pointer-events:none;
    will-change:transform;
}
.blob-1{width:340px;height:340px;background:radial-gradient(circle,#ff9ec4,transparent 70%);top:8%;left:4%;opacity:.55;animation:drift 14s ease-in-out infinite;}
.blob-2{width:280px;height:280px;background:radial-gradient(circle,#ffc2dd,transparent 70%);bottom:6%;right:6%;opacity:.6;animation:drift 17s ease-in-out infinite reverse;}
.blob-3{width:220px;height:220px;background:radial-gradient(circle,#ffb0d0,transparent 70%);top:55%;left:42%;opacity:.5;animation:drift 11s ease-in-out infinite;}
.blob-4{width:180px;height:180px;background:radial-gradient(circle,#ffd0e6,transparent 70%);top:18%;right:30%;opacity:.45;animation:drift 13s ease-in-out infinite reverse;}
@keyframes drift{
    0%,100%{transform:translate(0,0) scale(1);}
    50%{transform:translate(36px,-44px) scale(1.12);}
}

/* —— 飘落花瓣 / 爱心层 —— */
.fall-layer{position:fixed;inset:0;pointer-events:none;z-index:2;overflow:hidden;}
.petal{
    position:absolute;top:-40px;
    background:linear-gradient(135deg,#ffc2dd,#ff8fb8);
    border-radius:50% 0 50% 50%;
    animation:fall linear infinite;
    will-change:transform;
}
.heart{
    position:absolute;top:-40px;
    color:#ff8fb8;
    font-size:16px;
    text-shadow:0 0 6px rgba(255,143,184,.5);
    animation:fall linear infinite;
    will-change:transform;
}
@keyframes fall{
    0%{transform:translate3d(0,0,0) rotate(0deg);opacity:0;}
    8%{opacity:.85;}
    92%{opacity:.85;}
    100%{transform:translate3d(var(--sway,40px),105vh,0) rotate(720deg);opacity:0;}
}

/* —— LGGC 液态玻璃卡片 —— */
.glass{
    position:relative;
    z-index:3;
    width:min(430px,92vw);
    padding:54px 42px 46px;
    border:1px solid var(--lggc-border);
    border-radius:var(--lggc-radius);
    background:var(--lggc-bg);
    backdrop-filter:blur(calc(var(--lggc-blur) * 0.5)) saturate(180%);
    -webkit-backdrop-filter:blur(calc(var(--lggc-blur) * 0.5)) saturate(180%);
    box-shadow:
        inset 1.5px -1.5px 1px -1px rgba(255,255,255,0.96),
        inset -1.5px 1.5px 1px -1px rgba(255,255,255,0.92),
        inset 0 0 3px rgba(255,120,170,0.20),
        0 18px 44px rgba(255,111,174,0.18),
        0 4px 14px rgba(255,130,180,0.10);
    text-align:center;
    opacity:0;
    transform:translateY(36px) scale(.95);
    animation:cardIn 1.3s cubic-bezier(.16,1,.3,1) .35s forwards;
    transition:box-shadow .45s ease;
}
.glass.entered{
    transition:transform .35s cubic-bezier(.16,1,.3,1), box-shadow .45s ease;
}
.glass.entered:hover{
    box-shadow:
        inset 1.5px -1.5px 1px -1px rgba(255,255,255,1),
        inset -1.5px 1.5px 1px -1px rgba(255,255,255,.96),
        inset 0 0 3px rgba(255,120,170,0.30),
        0 26px 56px rgba(255,111,174,0.26),
        0 6px 18px rgba(255,130,180,0.16);
}
@keyframes cardIn{to{opacity:1;transform:translateY(0) scale(1);}}

.glass::before{
    /* 顶部高光条，强化液态玻璃质感 */
    content:"";
    position:absolute;
    top:0;left:14%;right:14%;height:1.5px;
    border-radius:2px;
    background:linear-gradient(90deg,transparent,rgba(255,255,255,.9),transparent);
    pointer-events:none;
}

.label{
    font-size:13px;
    letter-spacing:7px;
    color:rgba(255,111,174,0.72);
    margin-bottom:20px;
    opacity:0;
    animation:txtIn .9s ease .9s forwards;
}

.name{
    font-size:clamp(38px,9vw,52px);
    font-weight:700;
    line-height:1.15;
    margin-bottom:10px;
    background:linear-gradient(120deg,#ff6fae,#ffb3d1,#ff6fae,#ff9ec4,#ff6fae);
    background-size:300% auto;
    -webkit-background-clip:text;
    background-clip:text;
    -webkit-text-fill-color:transparent;
    opacity:0;
    animation:txtIn .9s ease 1.1s forwards, shine 4.5s linear infinite;
}
@keyframes shine{to{background-position:300% center;}}

.age{
    font-size:21px;
    color:rgba(200,80,140,0.82);
    margin-bottom:30px;
    opacity:0;
    animation:txtIn .9s ease 1.3s forwards;
}
.age b{
    font-size:26px;
    color:var(--pink-5);
    margin:0 2px;
}

.divider{
    width:62px;height:2px;margin:0 auto 28px;border:0;
    background:linear-gradient(90deg,transparent,var(--pink-4),transparent);
    opacity:0;
    animation:txtIn .9s ease 1.5s forwards;
}

.wish{
    font-size:18px;
    line-height:2;
    color:rgba(75,45,60,0.85);
    margin-bottom:34px;
    opacity:0;
    animation:txtIn .9s ease 1.6s forwards;
}

.btn{
    display:inline-block;
    padding:13px 40px;
    font-family:inherit;
    font-size:15px;
    letter-spacing:3px;
    color:rgba(255,111,174,0.92);
    border:1px solid rgba(255,130,180,0.35);
    border-radius:50px;
    background:rgba(255,255,255,0.32);
    cursor:pointer;
    opacity:0;
    animation:txtIn .9s ease 1.8s forwards;
    backdrop-filter:blur(4px);
    -webkit-backdrop-filter:blur(4px);
    transition:all .3s ease;
}
.btn:hover{
    background:rgba(255,130,180,0.16);
    transform:translateY(-2px) scale(1.04);
    box-shadow:0 6px 18px rgba(255,111,174,0.32);
    color:var(--pink-5);
}
.btn:active{transform:scale(.97);}

@keyframes txtIn{to{opacity:1;}}

.foot{
    margin-top:30px;
    font-size:12px;
    letter-spacing:3px;
    color:rgba(200,80,140,0.48);
    opacity:0;
    animation:txtIn .9s ease 2s forwards;
}

.confetti{position:fixed;pointer-events:none;z-index:10;will-change:transform;}

@media (max-width:480px){
    .glass{padding:44px 26px 38px;}
    .wish{font-size:16px;}
}
</style>
</head>
<body>
    <div class="blob blob-1"></div>
    <div class="blob blob-2"></div>
    <div class="blob blob-3"></div>
    <div class="blob blob-4"></div>
    <div class="fall-layer" id="fallLayer"></div>

    <main class="glass" id="card">
        <div class="label">HAPPY BIRTHDAY</div>
        <h1 class="name">孙嘉妤</h1>
        <p class="age">迎来 <b>14</b> 岁</p>
        <hr class="divider">
        <p class="wish">愿你的十四岁<br>如樱花般烂漫<br>如星光般闪耀<br>岁岁有今日，年年有今朝<br>生日快乐，万事胜意</p>
        <button class="btn" id="wishBtn" type="button">送出祝福</button>
        <div class="foot">· 致 孙嘉妤 ·</div>
    </main>

<script>
(function(){
    /* 飘落花瓣 + 爱心 */
    var layer = document.getElementById('fallLayer');
    var count = 20;
    for(var i=0;i<count;i++){
        var el;
        if(i % 4 === 0){
            el = document.createElement('div');
            el.className = 'heart';
            el.textContent = '♥';
            el.style.fontSize = (10 + Math.random()*12) + 'px';
            el.style.color = ['#ff8fb8','#ff6fae','#ffb3d1'][i%3];
        }else{
            el = document.createElement('div');
            el.className = 'petal';
            var s = 10 + Math.random()*14;
            el.style.width = s + 'px';
            el.style.height = s + 'px';
        }
        el.style.left = (Math.random()*100) + '%';
        el.style.animationDuration = (7 + Math.random()*9) + 's';
        el.style.animationDelay = (Math.random()*12) + 's';
        el.style.setProperty('--sway', (Math.random()*120 - 60) + 'px');
        el.style.opacity = (0.4 + Math.random()*0.5).toFixed(2);
        layer.appendChild(el);
    }

    /* 入场动画结束后解锁交互 */
    var card = document.getElementById('card');
    card.addEventListener('animationend', function(e){
        if(e.animationName === 'cardIn'){
            card.style.animation = 'none';
            card.style.opacity = '1';
            card.style.transform = 'none';
            card.classList.add('entered');
        }
    });

    /* 鼠标视差倾斜（入场后生效） */
    var raf = null;
    document.addEventListener('mousemove', function(e){
        if(!card.classList.contains('entered')) return;
        if(raf) return;
        raf = requestAnimationFrame(function(){
            var rx = (e.clientY / window.innerHeight - 0.5);
            var ry = (e.clientX / window.innerWidth - 0.5);
            card.style.transform = 'translateY(-4px) perspective(900px) rotateX(' + (-rx*5).toFixed(2) + 'deg) rotateY(' + (ry*5).toFixed(2) + 'deg)';
            raf = null;
        });
    });
    card.addEventListener('mouseleave', function(){
        if(!card.classList.contains('entered')) return;
        card.style.transform = 'translateY(0) perspective(900px) rotateX(0) rotateY(0)';
    });

    /* 点击按钮：爱心礼花 */
    var btn = document.getElementById('wishBtn');
    var colors = ['#ff8fb8','#ffb3d1','#ffd6e8','#ff6fae','#ffc2dd','#ffffff'];
    btn.addEventListener('click', function(e){
        var r = btn.getBoundingClientRect();
        var cx = r.left + r.width/2, cy = r.top + r.height/2;
        for(var i=0;i<26;i++){
            var c = document.createElement('div');
            c.className = 'confetti';
            c.style.left = cx + 'px';
            c.style.top = cy + 'px';
            c.style.width = c.style.height = (6 + Math.random()*8).toFixed(1) + 'px';
            c.style.background = colors[(Math.random()*colors.length)|0];
            c.style.borderRadius = Math.random()>0.5 ? '50%' : '2px';
            c.style.boxShadow = '0 0 6px rgba(255,143,184,.5)';
            document.body.appendChild(c);
            var a = (Math.PI*2*i)/26 + (Math.random()-0.5);
            var d = 90 + Math.random()*130;
            var dx = Math.cos(a)*d, dy = Math.sin(a)*d - 20;
            c.animate([
                {transform:'translate(-50%,-50%) scale(1)', opacity:1},
                {transform:'translate(calc(-50% + ' + dx + 'px), calc(-50% + ' + dy + 'px)) scale(0)', opacity:0}
            ], {duration: 800 + Math.random()*500, easing:'cubic-bezier(.16,1,.3,1)'});
            (function(node){setTimeout(function(){node.remove();}, 1400);})(c);
        }
        btn.textContent = '祝福已送达 ♡';
        setTimeout(function(){ btn.textContent = '送出祝福'; }, 2200);
    });

    /* 触摸设备：轻点卡片轻微弹跳反馈 */
    card.addEventListener('touchstart', function(){
        if(card.classList.contains('entered')){
            card.style.transform = 'translateY(-4px) scale(1.015)';
            setTimeout(function(){ card.style.transform = 'translateY(0) scale(1)'; }, 220);
        }
    }, {passive:true});
})();
</script>
</body>
</html>
